# 本仓库的 AI 审查标准。这里只放评审规则,不放密钥,也不放模型配置
# (模型集中在 Vanzo-Media/ci-workflows,密钥在本仓库 Secrets)。
#
# 注意:PR-Agent 从仓库默认分支读取本文件,不读 PR 分支。因此对本文件的
# 修改要合并进 main 之后,才会对后续 PR 生效——这是刻意的设计,避免
# 有人通过 PR 改掉审查自己的规则。
#
# 本仓库是全组织 CI 的实现所在:其产物在全部接入仓库中以 write 权限执行,
# 并持有各仓库的 API key。改动的爆炸半径最大,审查应比业务仓库更严格。

[pr_reviewer]
extra_instructions = """
本仓库为 GitHub Actions 工作流定义。优先报告:
- 权限声明的问题。注意显式声明 permissions 后,未列出的 scope 为 none
  而非默认值,漏掉 contents: read 会使评审静默降级而 job 仍然成功
- concurrency 与事件触发的竞态。concurrency 在工作流级生效,早于 job 的
  if 求值,因此一个注定被跳过的 run 也会影响同组中正在进行的运行
- 会让不可信代码取得 secrets 或 write 权限的写法
- 第三方 action 的引用方式(必须是完整 commit SHA)
- 静默失败:job 成功但实际未完成工作的路径

必查项:
- 日志、错误信息与对外响应中不得出现密钥、令牌,以及手机号、身份证号、
  银行卡号等个人信息
- 仅服务端可见的密钥不得出现在客户端代码或会被打包进前端的环境变量中
- 涉及金额的计算不得使用浮点数直接运算或比较
- 对外部系统的写操作应考虑重复投递与乱序到达

以下不要报告,CI 或格式化工具已覆盖:代码格式、lint 能发现的问题、
类型错误、拼写。

以下为已决策事项,不要重复提出(理由已写在相关文件的注释中):
- 建议把 Vanzo-Media/ci-workflows 的可复用工作流引用从 @main 改为固定
  commit SHA。该仓库属本组织且 main 分支受 ruleset 保护,为有意的取舍。
- 指出来自 fork 的 PR 拿不到 secrets 因而评审不运行。这是 GitHub 的安全
  设计,且本组织仓库均为私有、内部协作,不涉及该场景。
- 建议改用 pull_request_target 以便 fork PR 能拿到 secrets。该触发器会让
  不可信代码取得完整 secrets,已明确否决。
- 建议在调用方之外、于可复用工作流中重复声明 permissions,理由是"调用方的
  job 级 permissions 不作用于被调用的工作流"。该说法与实测不符:本组织仓库
  的默认 token 权限均为 read,而可复用工作流不声明任何 permissions,运行仍
  成功发布了 PR 评论、行级建议与标签(均需 write),说明调用方权限确实传递。
- 提出 PR-Agent 的配置项时必须确认其真实存在。此前曾建议使用
  pr_reviewer.max_inline_comments,而该键在 PR-Agent 中并不存在,写入后会被
  静默忽略,反而造成"限制已生效"的错觉。不确定时改用文字说明。

每次评审最多报告 5 条 Nit 级问题,超出的在总结里以数量概括。
"""

[pr_code_suggestions]
extra_instructions = """
只给能直接落地的具体修改,不要泛泛的架构建议或重构提议。
每条建议都要指明它会导致什么实际后果,而不只是"更好的写法"。

suggestion 块的格式要求(GitHub 对锚定行范围做字面替换,
内容不完整会导致采纳建议时直接损坏文件):
- 必须是能原样替换被锚定行的完整代码
- 禁止 "..." 等省略号占位、禁止 diff 标记(+/-)、禁止"其余保持不变"之类的说明
- 无法给出完整替换内容时,改用文字说明,不要用 suggestion 块
- 锚定范围尽量控制在 10 行以内;确需大范围改动时用文字描述
"""
