name: PR Agent

# 本仓库自身的 AI 代码审查。
#
# 刻意使用相对路径 ./ 而非 @main:pull_request 事件会加载 PR 分支上的
# workflow,因此对 pr-agent.yml 的改动会被"改动后的那一版"审查,
# 自带回归验证。这也是本仓库最需要审查的原因——它的产物在 7 个仓库中
# 以 write 权限执行。

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: ./.github/workflows/pr-agent.yml
    # 一旦显式声明 permissions,未列出的 scope 一律为 none 而非默认值。
    # contents: read 必需,否则 PR-Agent 读不到 .pr_agent.toml、读不到
    # 文件内容、算不出 merge base(全部 403),而 job 仍会成功,评审静默降级。
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
    # 与其余 7 个调用方保持一致:经 Portkey 网关调用 Qwen。本仓库自己的
    # DEEPSEEK_KEY 已被移除,故不再透传——那会是一条并不存在的退路。需要
    # 切回直连时,补上该 secret 并把这里改成 deepseek/ 前缀即可。
    #
    # 各参数的含义与注意事项(降级模型必须同走网关、custom_model_max_tokens
    # 必填)见 pr-agent.yml 中对应位置的注释,以及 README 的「走 OpenAI
    # 兼容网关(Portkey)」一节。
    with:
      model: "openai/@dashscope/qwen3.8-max"
      fallback_model: "openai/@deepseek/deepseek-chat"
      openai_api_base: "https://api.portkey.ai/v1"
      custom_model_max_tokens: "200000"
    secrets:
      PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
