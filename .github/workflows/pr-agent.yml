name: PR Agent (reusable)

# Vanzo-Media 统一的 AI 代码审查实现。各仓库通过 workflow_call 调用本文件,
# 自身只保留触发条件与授权,不重复实现细节。
#
# 调用方式见本仓库 README.md。
# 前置条件:调用方仓库的 Secrets 中需存在 model 所用 provider 的凭证
# (DeepSeek 用 DEEPSEEK_KEY;Bedrock 用 AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY)。

on:
  workflow_call:
    inputs:
      model:
        description: "主模型(LiteLLM 标识,需带 provider 前缀)"
        type: string
        default: "deepseek/deepseek-v4-flash"
      fallback_model:
        description: "主模型调用失败时的降级模型"
        type: string
        default: "deepseek/deepseek-v4-pro"
      auto_describe:
        description: "是否让 AI 改写 PR 标题与描述"
        type: string
        default: "false"
      handle_push_trigger:
        description: "push 新 commit 时是否重新评审"
        type: string
        default: "true"
      aws_region:
        description: "Bedrock 区域。仅当 model 或 fallback_model 为 bedrock/ 前缀时使用"
        type: string
        default: "us-east-1"
      max_model_tokens:
        description: "单次评审可用的 token 总预算上限。装不下的文件会被列入「未纳入审查」清单"
        type: string
        default: "200000"
      openai_api_base:
        description: "OpenAI 兼容网关的 base URL(如 Portkey: https://api.portkey.ai/v1)。留空则直连各厂商"
        type: string
        default: ""
      custom_model_max_tokens:
        description: "模型的上下文上限。仅当 model 不在 PR-Agent 的 MAX_TOKENS 表中时必填(走网关时必然如此)"
        type: string
        default: "-1"
    # 各 provider 的凭证一律可选:调用方只配 model 实际用到的那一套。
    # 未使用的 provider 传空字符串是安全的——PR-Agent 的 provider 分支全部是
    # 真值判断(litellm_ai_handler.py 中 `if get_settings().get("DEEPSEEK.KEY", None):`
    # 与 `elif get_settings().get("aws.AWS_ACCESS_KEY_ID"):`),空串为 falsy,
    # 整段跳过,不会与在用的 provider 互相干扰。
    #
    # DEEPSEEK_KEY 由 required: true 改为 false 不损失任何保护:workflow_call 的
    # required 只校验"调用方传了这个参数",传空串同样通过。真正的拦截一直是下面
    # 那个校验步骤,现已改为按 model 前缀分派。
    secrets:
      DEEPSEEK_KEY:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      # OpenAI 兼容网关(Portkey)的密钥。经 openai.key 下发,与 openai_api_base
      # 配对使用。厂商自己的 key 存在网关侧,不再进入各仓库的 Secrets。
      PORTKEY_API_KEY:
        required: false

jobs:
  pr_agent_job:
    # 两重作用:
    # 1. 不评审草稿 PR。opened 与 synchronize 对草稿同样触发,而 ready_for_review
    #    本就是"转正式时评审一次"的事件——不排除草稿的话,半成品代码会被反复
    #    评审,产出的建议到 PR 真正 ready 时多已过时,纯属浪费。
    # 2. 拒绝非 pull_request 事件。调用方约定只监听 pull_request,但那是约定
    #    而非强制;若有人复制旧模板或手写时加了 issue_comment,这里兜底。
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    name: AI Code Review
    timeout-minutes: 15
    steps:
      # 前置校验。workflow_call 的 secrets.required 只要求调用方"传了这个参数",
      # 传空字符串同样满足,因此新仓库接入时忘配 secret 不会被拦住,而是跑满
      # 几分钟后失败在模型认证上,错误信息含糊。这里快速失败并给出可执行的提示。
      # secret 经 env 中转而非直接插入 shell,遵循官方安全加固建议。
      #
      # 按 provider 前缀分派,只校验本次真正会用到的那套凭证——否则单 provider
      # 的调用方会被与自己无关的缺失卡住。fallback_model 一并校验:它与主模型
      # 可以来自不同厂商,漏配时主模型一切正常、只有降级那一刻才炸,更难排查。
      - name: 校验 provider 凭证已配置
        env:
          MODEL: ${{ inputs.model }}
          FALLBACK_MODEL: ${{ inputs.fallback_model }}
          OPENAI_API_BASE: ${{ inputs.openai_api_base }}
          CUSTOM_MODEL_MAX_TOKENS: ${{ inputs.custom_model_max_tokens }}
          PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          fail() {
            echo "::error::$1 请在 Settings → Secrets and variables → Actions 添加(组织级 secret 在当前计划下对私有仓库无效,需每个仓库各自添加)。"
            exit 1
          }
          check_provider() {
            case "$1" in
              deepseek/*)
                [ -n "$DEEPSEEK_KEY" ] \
                  || fail "模型 $1 需要 DEEPSEEK_KEY,但本仓库未配置。"
                ;;
              bedrock/*)
                # 只配 AK 而漏配 SK 会命中 PR-Agent 的 assert "AWS credentials
                # are incomplete",堆栈晦涩;这里提前拦下并点明缺哪一个。
                [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] \
                  || fail "模型 $1 需要 AWS_ACCESS_KEY_ID 与 AWS_SECRET_ACCESS_KEY 两者,但本仓库缺少其中至少一个。"
                ;;
              openai/*)
                # OpenAI 兼容网关(Portkey 等)。key 与 base URL 必须成对:
                # 只给 key 会打到 api.openai.com 上,拿着网关的 key 认证失败;
                # 只给 base URL 则完全没有凭证。
                [ -n "$PORTKEY_API_KEY" ] \
                  || fail "模型 $1 需要 PORTKEY_API_KEY,但本仓库未配置。"
                [ -n "$OPENAI_API_BASE" ] \
                  || fail "模型 $1 是 openai/ 前缀,必须同时传 openai_api_base(如 https://api.portkey.ai/v1)。"
                ;;
              *)
                echo "::warning::模型 $1 的 provider 前缀未被本校验覆盖,跳过凭证检查。若认证失败,请查看 PR Agent 步骤的日志。"
                ;;
            esac
          }
          check_provider "$MODEL"
          check_provider "$FALLBACK_MODEL"

          # openai.api_base 一旦设置就是全局的:PR-Agent 把它塞进每一次
          # completion 调用的 kwargs(litellm_ai_handler.py 中
          # `kwargs = {..., "api_base": api_base}`),不按 provider 区分。
          # 因此主模型走网关、降级模型留直连的组合必然失败——降级请求会带着
          # 厂商的 key 打到网关地址上。这种配置只在降级那一刻才炸,极难排查,
          # 在这里直接拦下。
          #
          # 走网关时跨厂商降级仍然可行,只是要写成同一个网关下的不同 slug,
          # 例如 openai/@dashscope/... 降级到 openai/@deepseek/...。
          if [ -n "$OPENAI_API_BASE" ]; then
            for m in "$MODEL" "$FALLBACK_MODEL"; do
              case "$m" in
                openai/*) ;;
                *) fail "已设置 openai_api_base,但 $m 不是 openai/ 前缀。api_base 对所有 provider 全局生效,混用会让该模型的请求被打到网关地址上。" ;;
              esac
            done
            # 走网关时 model 必然不在 PR-Agent 的 MAX_TOKENS 表里
            # (表按完整模型串匹配,而网关模型串形如 openai/@slug/name),
            # get_max_tokens() 届时直接抛异常。这里提前拦下并说明原因。
            case "$CUSTOM_MODEL_MAX_TOKENS" in
              ''|*[!0-9]*|0*) fail "已设置 openai_api_base,必须同时传十进制正整数的 custom_model_max_tokens(当前值:${CUSTOM_MODEL_MAX_TOKENS:-空});网关模型不在 PR-Agent 的 MAX_TOKENS 表中,非法值会在评审时抛异常。" ;;
            esac
          fi

      - name: PR Agent action step
        id: pragent
        # 锁定到具体 commit SHA 而非 @main 或 tag。
        # 该 action 在调用方仓库的上下文中执行,持有 write 权限的 GITHUB_TOKEN
        # 和各 provider 的模型凭证,若跟随可变引用,上游任何提交都会未经审查
        # 直接运行。
        # tag 可被 force-push 移动,SHA 不可伪造。升级由 Dependabot 提 PR。
        uses: the-pr-agent/pr-agent@ab6ec54bfeb37933ddb74259338752e9272016c6 # v0.44.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # DeepSeek key。两处都设是有意为之:deepseek.key 是 PR-Agent 的
          # 配置路径,DEEPSEEK_API_KEY 是 LiteLLM 直接读取的环境变量。
          # 注意:来自 fork 的 PR 拿不到 secrets,其评审会认证失败——这是
          # GitHub 的安全设计,内部协作(同仓库分支)不受影响。
          deepseek.key: ${{ secrets.DEEPSEEK_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_KEY }}

          # Bedrock 凭证,同样双写:aws.* 是 PR-Agent 的配置路径,大写形式是
          # LiteLLM/boto3 直接读取的环境变量。
          # 区域的变量名是 AWS_REGION_NAME 而非 AWS_REGION,两者都只认前者。
          # aws.AWS_REGION_NAME 恒为非空(input 有默认值),但它只在
          # aws.AWS_ACCESS_KEY_ID 非空时才进入对应分支,对 DeepSeek 调用方无影响。
          aws.AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws.AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws.AWS_REGION_NAME: ${{ inputs.aws_region }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION_NAME: ${{ inputs.aws_region }}

          # 模型必须配在 env。不能放进各仓库的 .pr_agent.toml——
          # PR-Agent 从仓库默认分支读取该文件,PR 分支上的改动不生效。
          config.model: ${{ inputs.model }}
          config.fallback_models: '["${{ inputs.fallback_model }}"]'

          # token 预算上限。必须显式设置:PR-Agent 的默认值是 32000,且它是
          # 硬上限——get_max_tokens() 最后一步是 min(config.max_model_tokens,
          # 模型自身上限),所以模型再大也会被掐到 32k。默认值下,一个 40 文件、
          # 8000 行的 PR 只有十几个文件进得了 prompt,其余被列入「未纳入审查」
          # 清单,而 job 仍然成功,评审只是静默降级成部分审查(评论里的
          # "kind": "partial")。换更大的模型不解决这个问题,改这里才解决。
          #
          # 取 200000 而非模型上限(deepseek-v4-flash 在 PR-Agent 的 MAX_TOKENS
          # 表里登记为 1M)有两个原因:一是上游注释指出输入过长会让模型表现下降;
          # 二是每次 push 都跑 /review + /improve 两轮,输入 token 直接乘二。
          # 200k 够覆盖本组织迄今最大的 PR 并留一倍余量,又不至于让某个失控的
          # PR 一次烧掉百万级输入。确实需要更大时,由调用方传 max_model_tokens。
          config.max_model_tokens: ${{ inputs.max_model_tokens }}

          # OpenAI 兼容网关(Portkey 等)。与直连各厂商互斥,由上面的校验步骤保证。
          #
          # 只写 openai.key 而不写 OPENAI_API_KEY,与本文件里 deepseek/bedrock
          # 的双写做法不同:PR-Agent 读到 OPENAI.KEY 后会自己赋给 litellm.openai_key
          # (litellm_ai_handler.py 的 `litellm.openai_key = get_settings().openai.key`),
          # LiteLLM 不需要再从环境变量取一遍。多写一个空的 OPENAI_API_KEY 反而可能
          # 让不走网关的调用方被误判成"配了 OpenAI 凭证"。
          #
          # 两者留空时整段跳过(PR-Agent 对 OPENAI.KEY 与 OPENAI.API_BASE 都是
          # 真值判断),对直连 deepseek/bedrock 的调用方无影响。
          openai.key: ${{ secrets.PORTKEY_API_KEY }}
          openai.api_base: ${{ inputs.openai_api_base }}

          # 模型的上下文上限,仅在 model 不在 PR-Agent 的 MAX_TOKENS 表里时生效。
          # 默认 -1 表示"未设置",对直连调用方是 no-op(get_max_tokens 只在
          # `elif custom_max_tokens > 0` 分支用它)。走网关时必填,理由见校验步骤。
          #
          # 注意这是纯手工维护的数字:写错不会报错,只会让评审静默按错的预算跑。
          # 最终预算是 min(max_model_tokens, 本值),所以填到不小于
          # max_model_tokens 即可,不必精确等于模型的真实窗口。
          config.custom_model_max_tokens: ${{ inputs.custom_model_max_tokens }}

          # 以 GitHub 原生 suggestion 块发布建议,使评论上出现
          # 可直接提交的 Commit suggestion 按钮。
          pr_code_suggestions.commitable_code_suggestions: "true"

          # push 触发的重审执行哪些命令。必须显式指定:默认值是
          # ["/describe", "/review"],会改写 PR 标题描述,且不含 /improve
          # (即 push 后的重审没有可提交建议)。
          github_action_config.handle_push_trigger: ${{ inputs.handle_push_trigger }}
          github_action_config.push_commands: '["/review", "/improve"]'

          # PR 打开/重开时自动触发哪些工具
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
          github_action_config.auto_describe: ${{ inputs.auto_describe }}
